name: Verify application delivery baseline

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  generator-and-generated-app:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify exact candidate SHA
        run: |
          echo "Candidate: $TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Run generator tests
        run: python -m unittest discover -s tests -v
      - name: Generate and test application
        run: |
          sandbox="$(mktemp -d)"
          python -m ade examples/demo.json "$sandbox/generated"
          (cd "$sandbox/generated" && python -m unittest discover -s tests -v)
      - name: Generate functional web-list application and run HTTP tests
        run: |
          sandbox="$(mktemp -d)"
          python -m ade examples/web-list.json "$sandbox/generated"
          (cd "$sandbox/generated" && python -m unittest discover -s tests -p test_app.py -v)
      - name: Install Chromium browser test dependencies
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Browser verify generated UI API SQLite persistence
        run: |
          sandbox="$(mktemp -d)"
          python -m ade examples/web-list.json "$sandbox/generated"
          (cd "$sandbox/generated" && python -m unittest discover -s tests -p test_browser.py -v)
